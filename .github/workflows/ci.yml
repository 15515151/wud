name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags:
      - '*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: write
  packages: write

env:
  NODE_VERSION: 24
  IMAGE_NAME: wud
  DOCKER_PLATFORMS: linux/arm64/v8,linux/amd64

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Run lint
        run: |
          (cd app && npm run lint)
          (cd ui && npm run lint)
          (cd e2e && npm run lint)

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            ui/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd ui && npm ci)
      - name: Run unit tests
        run: |
          (cd app && npm test)
          (cd ui && npm run test:unit)

  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            website/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd website && npm ci)
      - name: Lint documentation
        run: (cd website && npm run lint:docs)
      - name: Build demo UI
        run: (cd ui && npm run build:demo)
      - name: Build website
        run: (cd website && npm run build)
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: website/build
          retention-days: 1

  update-screenshots:
    name: Update Documentation Screenshots
    needs: [build-docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            ui-e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd ui-e2e && npm ci)
      - name: Install Playwright Browsers
        run: (cd ui-e2e && npx playwright install --with-deps chromium)
      - name: Generate Screenshots
        run: ./scripts/generate-screenshots.sh
      - name: Commit updated screenshots
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update UI screenshots [automated]"
          file_pattern: "website/docs/assets/screenshots/*.png website/docs/assets/ui.png"

  e2e-test:
    name: E2E Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    env:
      GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd e2e && npm ci)
      - name: Run E2E Tests
        run: ./scripts/run-e2e-tests.sh
      - name: Show wud logs on failure
        if: failure()
        run: docker logs wud || true

  e2e-kubernetes:
    name: E2E Kubernetes Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd e2e && npm ci)
      - name: Run Kubernetes E2E Tests
        run: ./scripts/run-k8s-e2e-tests.sh
      - name: Show wud-k8s logs on failure
        if: failure()
        run: docker logs wud-k8s || true

  e2e-nomad:
    name: E2E Nomad Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd e2e && npm ci)
      - name: Run Nomad E2E Tests
        run: ./scripts/run-nomad-e2e-tests.sh
      - name: Show wud-nomad logs on failure
        if: failure()
        run: docker logs wud-nomad || true

  e2e-swarm:
    name: E2E Swarm Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            app/package-lock.json
            e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd app && npm ci)
          (cd e2e && npm ci)
      - name: Run Swarm E2E Tests
        run: ./scripts/run-swarm-e2e-tests.sh
      - name: Show wud-swarm logs on failure
        if: failure()
        run: docker logs wud-swarm || true

  ui-e2e-test:
    name: UI E2E Tests
    needs: [lint, unit-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            ui/package-lock.json
            ui-e2e/package-lock.json
      - name: Install dependencies
        run: |
          (cd ui && npm ci)
          (cd ui-e2e && npm ci)
      - name: Run UI E2E Tests
        run: ./scripts/run-ui-tests.sh
      - name: Show wud logs on failure
        if: failure()
        run: docker logs wud || true
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui-e2e/playwright-report/
          retention-days: 7

  publish:
    name: Publish Docker Image
    needs: [lint, unit-test, e2e-test, e2e-kubernetes, e2e-nomad, e2e-swarm, ui-e2e-test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Docker Hub publishing is optional: forks usually only have GITHUB_TOKEN.
      # When DOCKER_USERNAME / DOCKER_PASSWORD are missing, the image is pushed
      # to GHCR only instead of failing the whole pipeline.
      - name: Detect Docker Hub credentials
        id: dockerhub
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        run: |
          images="${GHCR_IMAGE}"
          if [ -n "${DOCKER_USERNAME}" ] && [ -n "${DOCKER_PASSWORD}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            images="${DOCKER_USERNAME}/${{ env.IMAGE_NAME }}"$'\n'"${images}"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Docker Hub credentials not configured, publishing to GHCR only (${GHCR_IMAGE})."
          fi
          {
            echo "images<<EOF"
            echo "${images}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dockerhub.outputs.images }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: steps.dockerhub.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            WUD_VERSION=${{ steps.meta.outputs.version }}

  deploy-docs:
    name: Deploy Docs
    needs: [build-docs, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: website/build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./website/build
          cname: getwud.app
